name: Build release

# v1.0.0 같은 태그를 push 하면 Windows exe 와 macOS .app 을 만들어 Releases 에 올립니다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name UsageWidget windows/usage_widget.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: UsageWidget-windows
          path: dist/UsageWidget.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller rumps
      - working-directory: mac
        run: |
          pyinstaller --noconfirm --windowed --name "AI Usage" \
            --osx-bundle-identifier com.local.aiusage --hidden-import rumps usage_mac.py
          plutil -insert LSUIElement -bool true "dist/AI Usage.app/Contents/Info.plist"
          codesign --force --deep --sign - "dist/AI Usage.app"
          ditto -c -k --keepParent "dist/AI Usage.app" "dist/AI-Usage-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Usage-mac
          path: mac/dist/AI-Usage-mac.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/UsageWidget-windows/UsageWidget.exe
            out/AI-Usage-mac/AI-Usage-mac.zip
